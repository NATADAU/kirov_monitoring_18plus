<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f4ef"><title>Мониторинг 18+</title><link rel="manifest" href="manifest.webmanifest"><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f4ef;color:#1d1d1f}.wrap{max-width:720px;margin:auto;padding:20px 16px 110px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000012}h1{font-size:28px;margin:8px 0}h2{font-size:22px;margin:0 0 12px}.muted{color:#6e6e73}.progress{height:10px;background:#e5e5ea;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:#3a7d6b;width:0}.q{padding:14px 0;border-top:1px solid #eee;scroll-margin-top:12px}.q:first-child{border-top:0}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.answers button,.big,.close{border:0;border-radius:12px;padding:12px;font-size:16px}.answers button{background:#f1f1f4}.answers button.active{background:#1d1d1f;color:white}.note{width:100%;box-sizing:border-box;margin-top:8px;border:1px solid #ddd;border-radius:12px;padding:10px;font-size:16px;min-height:70px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(12px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.bottom .row{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{background:#1d1d1f;color:white}.secondary{background:#e9eceb!important;color:#1d1d1f!important}.modal{display:none;position:fixed;inset:0;background:#f6f4ef;z-index:10;overflow:auto;padding:20px 16px 100px}.modal.open{display:block}.modal-inner{max-width:720px;margin:auto}.missing{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:14px;padding:14px;margin:8px 0;font-size:16px}.num{display:inline-block;min-width:48px;font-weight:800}.close{position:sticky;bottom:10px;width:100%;background:#1d1d1f;color:#fff;margin-top:16px}.save-help{font-size:14px;color:#6e6e73;margin:8px 2px 0}</style></head><body><div class="wrap"><h1>Мониторинг 18+</h1><div class="muted">Полевой режим для обхода учреждения</div><div class="card"><div id="progressText">Проверено 0 из 42</div><div class="progress"><div id="bar"></div></div></div><div id="sections"></div></div><div class="bottom"><div class="row"><button class="big secondary" onclick="showMissing()">Что осталось?</button><button class="big" onclick="saveResults()">Сохранить результаты</button></div><div class="save-help" style="max-width:720px;margin:6px auto 0">Скачается файл с пунктами 1–42, ответами и заметками. Обычно Android сохраняет его в папку «Загрузки».</div></div><div id="missingModal" class="modal"><div class="modal-inner"><h1>Что осталось?</h1><div class="muted">Непроверенные пункты идут строго по номерам анкеты. Нажмите на пункт, чтобы перейти к нему.</div><div id="missingList"></div><button class="close" onclick="closeMissing()">Вернуться к обходу</button></div></div><script>const sections=[{t:'🚌 Подъезд и территория',qs:[1,2,3]},{t:'🚪 Отделения',qs:[4,5,6,7,8,38,40,41]},{t:'🛏 Жилая комната',qs:[17,20,22,23,24,25]},{t:'🚿 Санузел и душ',qs:[13,14,15,16]},{t:'🪥 Личная гигиена',qs:[18,19]},{t:'♿ Интенсивный уход',qs:[10,11,12,30]},{t:'🍽 Столовая',qs:[29,31,32,33,34,35]},{t:'👥 Жизнь и самостоятельность',qs:[21,26,27,36,37,39]},{t:'⚖️ Оборудование и документы',qs:[9,28,42]}];const labels={1:'Остановка общественного транспорта рядом',2:'Жители посещают внешние объекты инфраструктуры',3:'Территория доступна для маломобильных граждан',4:'Комнаты и коридоры доступны для МГН',5:'Есть помещения для отдыха и общения',6:'Жители свободно пользуются помещениями для отдыха',7:'Есть отдельный спортивный зал',8:'Жители свободно пользуются спортзалом',9:'Отдельные помещения для встреч с родственниками',10:'Осуществляют ли жители общих отделений свободные прогулки по территории учреждения',11:'Регулярные прогулки жителей, нуждающихся в помощи',12:'Жителей высаживают в кресла/коляски',13:'В санузлах есть перегородки/кабинки',14:'В душевых есть перегородки/кабинки',15:'Есть ширмы/потолочные шторы',16:'Ширмы используются во время ухода',17:'Стульев, тумбочек и мест в шкафах достаточно',18:'Есть личные зубные щётки и расчёски',19:'Есть другие личные средства гигиены',20:'Есть личные вещи',21:'Есть возможность пользоваться карманными деньгами',22:'Есть индивидуальная обувь',23:'Есть индивидуальная верхняя одежда',24:'Одежда имеет индивидуальную маркировку',25:'Есть индивидуальное нижнее бельё',26:'Есть холодильники для личных продуктов',27:'Можно пользоваться стиральной машиной',28:'Есть оборудование для взвешивания маломобильных жителей',29:'Используется металлическая столовая посуда',30:'Есть прикроватные столики для приёма пищи',31:'Жители пользуются вилками',32:'Есть адаптивная посуда',33:'Доступна питьевая вода между приёмами пищи',34:'Учитываются индивидуальные потребности в питании',35:'Есть вариативное питание',36:'Можно заводить домашних животных',37:'Есть семейные пары, проживающие совместно',38:'Помещения маркированы средствами АДК',39:'Персонал использует средства АДК',40:'Есть настенные часы',41:'Есть зеркала',42:'Количество жителей, выезжавших на мероприятия'};const state=JSON.parse(localStorage.getItem('m18')||'{}');function save(){localStorage.setItem('m18',JSON.stringify(state));updateProgress()}function render(){const root=document.getElementById('sections');sections.forEach(s=>{const c=document.createElement('div');c.className='card';c.innerHTML='<h2>'+s.t+'</h2>';s.qs.forEach(n=>{const q=document.createElement('div');q.className='q';q.id='q'+n;q.innerHTML='<b>Пункт '+n+'.</b> '+labels[n]+'<div class="answers">'+['Да','Нет','Частично','Не проверено'].map(a=>'<button data-n="'+n+'" data-a="'+a+'">'+a+'</button>').join('')+'</div><textarea class="note" placeholder="Заметка…" data-note="'+n+'">'+(state[n]?.note||'')+'</textarea>';c.appendChild(q)});root.appendChild(c)});document.querySelectorAll('[data-n]').forEach(b=>{if(state[b.dataset.n]?.a===b.dataset.a)b.classList.add('active');b.onclick=()=>{const n=b.dataset.n;state[n]=state[n]||{};state[n].a=b.dataset.a;document.querySelectorAll('[data-n="'+n+'"]').forEach(x=>x.classList.toggle('active',x===b));save()}});document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{const n=t.dataset.note;state[n]=state[n]||{};state[n].note=t.value;save()});updateProgress()}function updateProgress(){let done=0;for(let i=1;i<=42;i++)if(state[i]?.a&&state[i].a!=='Не проверено')done++;document.getElementById('progressText').textContent='Проверено '+done+' из 42';document.getElementById('bar').style.width=(done/42*100)+'%'}function showMissing(){const box=document.getElementById('missingList');box.innerHTML='';let count=0;for(let i=1;i<=42;i++){if(!state[i]?.a||state[i].a==='Не проверено'){count++;const b=document.createElement('button');b.className='missing';b.innerHTML='<span class="num">№ '+i+'</span>'+labels[i];b.onclick=()=>goToQuestion(i);box.appendChild(b)}}if(!count)box.innerHTML='<div class="card"><b>Готово — проверены все 42 пункта.</b></div>';document.getElementById('missingModal').classList.add('open')}function closeMissing(){document.getElementById('missingModal').classList.remove('open')}function goToQuestion(n){closeMissing();setTimeout(()=>document.getElementById('q'+n).scrollIntoView({behavior:'smooth',block:'start'}),50)}function saveResults(){const rows=[];for(let i=1;i<=42;i++)rows.push([i,labels[i],state[i]?.a||'Не проверено',(state[i]?.note||'').replace(/\n/g,' ')]);const csv='№;Пункт;Ответ;Заметка\n'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='monitoring-18plus-results.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
